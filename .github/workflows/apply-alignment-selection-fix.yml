name: Apply Alignment Selection Fix

on:
  push:
    branches:
      - fix/engine-correctness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/engine-correctness
      - name: Prefer strongest chronology alignment
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scraper.py')
          text = path.read_text()
          old = '''    if best_exact is not None:\n        return best_exact\n    if best_fuzzy is not None:\n        _, overlap, offset, mode = best_fuzzy\n        return overlap, offset, mode\n    return None\n'''
          new = '''    exact_overlap = best_exact[0] if best_exact is not None else -1\n    fuzzy_overlap = best_fuzzy[1] if best_fuzzy is not None else -1\n\n    # Pilih alignment dengan bukti chronology terluas. Exact menang saat coverage\n    # setara, tetapi exact tail pendek tidak boleh menutupi fuzzy alignment panjang\n    # yang hanya berbeda pada koreksi historis kecil.\n    if best_exact is not None and exact_overlap >= fuzzy_overlap:\n        return best_exact\n    if best_fuzzy is not None:\n        _, overlap, offset, mode = best_fuzzy\n        return overlap, offset, mode\n    return None\n'''
          if old not in text:
              raise SystemExit('alignment selection target not found')
          path.write_text(text.replace(old, new, 1))

          Path('.github/workflows/apply-alignment-selection-fix.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper.py .github/workflows/apply-alignment-selection-fix.yml
          git commit -m "fix(scraper): prefer strongest history alignment evidence"
          git push origin HEAD:fix/engine-correctness
