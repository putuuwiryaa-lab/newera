name: Apply History Days Integrity Fix

on:
  push:
    branches:
      - fix/engine-correctness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/engine-correctness
      - name: Fix authoritative day metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scraper.py')
          text = path.read_text()

          old = 'import base64\nimport urllib3\n'
          new = 'import base64\nimport urllib3\nfrom datetime import datetime\n'
          if old not in text:
              raise SystemExit('import anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''def get_market_days_schema(market_id=""):\n    mid = market_id.lower()\n'''
          replacement = '''DAY_NAMES_ID = ("Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu", "Minggu")\n\n\ndef _weekday_from_ddmmyyyy(date_str):\n    """Ubah tanggal dd/mm/yyyy menjadi nama hari Indonesia."""\n    try:\n        weekday = datetime.strptime(date_str, "%d/%m/%Y").weekday()\n        return DAY_NAMES_ID[weekday]\n    except (TypeError, ValueError):\n        return ""\n\n\ndef _is_valid_day(value):\n    return value in DAY_NAMES_ID\n\n\ndef get_market_days_schema(market_id=""):\n    mid = market_id.lower()\n'''
          if anchor not in text:
              raise SystemExit('day helper anchor not found')
          text = text.replace(anchor, replacement, 1)

          old = '                        all_days.append("Senin")\n'
          new = '                        all_days.append(_weekday_from_ddmmyyyy(date_str))\n'
          if old not in text:
              raise SystemExit('Sejahtera fallback target not found')
          text = text.replace(old, new, 1)

          old = '''    e_days = _align_days(existing_days, existing, schema)\n    s_days = _align_days(scraped_days, scraped, schema)\n'''
          new = '''    e_days = _align_days(existing_days, existing, schema)\n    s_days = _align_days(scraped_days, scraped, schema)\n    raw_scraped_days = list(scraped_days[:len(scraped)])\n'''
          if old not in text:
              raise SystemExit('merge day arrays target not found')
          text = text.replace(old, new, 1)

          old = '''                merged_days.append(e_days[e_idx])\n            elif has_existing:\n'''
          new = '''                # Hari dari source scrape terbaru lebih otoritatif pada area overlap.\n                # Jika source tidak menyediakan hari valid (mis. Rajapaito), pertahankan existing.\n                scraped_day = raw_scraped_days[s_idx] if s_idx < len(raw_scraped_days) else ""\n                merged_days.append(scraped_day if _is_valid_day(scraped_day) else e_days[e_idx])\n            elif has_existing:\n'''
          if old not in text:
              raise SystemExit('overlap merged_days target not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/apply-history-days-integrity-fix.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper.py .github/workflows/apply-history-days-integrity-fix.yml
          git commit -m "fix(scraper): preserve authoritative history day metadata"
          git push origin HEAD:fix/engine-correctness
