name: Apply Cold Start Fix

on:
  push:
    branches:
      - fix/engine-correctness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/engine-correctness
      - name: Prevent synthetic audit on initial import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scraper.py')
          s = p.read_text()
          old = '''        # Length detects a legitimate duplicate-valued new draw (e.g. ...1234,1234).\n        is_new_draw = len(merged_history) > len(existing_history)\n        history_corrected = (not is_new_draw and merged_history != existing_history)'''
          new = '''        # Hanya history yang sudah pernah tersimpan boleh menghasilkan event new-draw.\n        # Initial import adalah warm-start, bukan audit periode production.\n        had_prior_history = bool(existing_history)\n        is_new_draw = had_prior_history and len(merged_history) > len(existing_history)\n        history_corrected = (had_prior_history and not is_new_draw and merged_history != existing_history)'''
          if old not in s:
              raise SystemExit('cold-start target not found')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/apply-cold-start-fix.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper.py .github/workflows/apply-cold-start-fix.yml
          git commit -m "fix(scraper): treat initial import as warm start"
          git push origin HEAD:fix/engine-correctness
