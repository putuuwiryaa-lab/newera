name: Apply Prospective Live Metrics

on:
  push:
    branches: [feat/prospective-live-metrics]
    paths: ['.github/workflows/apply-prospective-live-metrics.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prospective-live-metrics
      - name: Patch evaluator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('production_evaluator.py')
          s=p.read_text()

          s=s.replace(
              'def _new_accumulator() -> Dict:\n    return {\n',
              'def _new_accumulator(include_live_only: bool = True) -> Dict:\n    acc = {\n',
              1,
          )
          old='''        "sniper": {\n            "active_draws": 0,\n            "any_hits": 0,\n            "top_hits": 0,\n            "secondary_hits": 0,\n            "super_hits": 0,\n            "baseline_sum": 0.0,\n        },\n    }\n\n\ndef _accumulate'''
          new='''        "sniper": {\n            "active_draws": 0,\n            "any_hits": 0,\n            "top_hits": 0,\n            "secondary_hits": 0,\n            "super_hits": 0,\n            "baseline_sum": 0.0,\n        },\n    }\n    if include_live_only:\n        acc["live_only"] = _new_accumulator(False)\n    return acc\n\n\ndef _accumulate'''
          if old not in s:
              raise SystemExit('new accumulator tail anchor missing')
          s=s.replace(old,new,1)

          old='''def _accumulate(acc: Dict, prediction: Dict, actual_result: str, source: str) -> None:\n    if not isinstance(prediction, dict) or len(actual_result) != 4 or not actual_result.isdigit():\n        return\n\n    k, e = int(actual_result[2]), int(actual_result[3])\n'''
          new='''def _accumulate(acc: Dict, prediction: Dict, actual_result: str, source: str) -> None:\n    if not isinstance(prediction, dict) or len(actual_result) != 4 or not actual_result.isdigit():\n        return\n\n    # True prospective performance must remain separable from reconstructed replay.\n    if source == "live":\n        live_only = acc.get("live_only")\n        if not isinstance(live_only, dict):\n            live_only = _new_accumulator(False)\n            acc["live_only"] = live_only\n        _accumulate(live_only, prediction, actual_result, "isolated")\n\n    k, e = int(actual_result[2]), int(actual_result[3])\n'''
          if old not in s:
              raise SystemExit('accumulate head anchor missing')
          s=s.replace(old,new,1)

          s=s.replace(
              '    acc["live_draws" if source == "live" else "replay_draws"] += 1\n',
              '    if source == "live":\n        acc["live_draws"] += 1\n    elif source == "replay":\n        acc["replay_draws"] += 1\n',
              1,
          )

          anchor='''    return {\n        "evaluator_version": EVALUATOR_VERSION,\n'''
          insert='''    live_acc = acc.get("live_only") if isinstance(acc.get("live_only"), dict) else None\n    live_tested = int(live_acc.get("tested", 0)) if live_acc else 0\n    prospective = {\n        "tested_draws": live_tested,\n        "minimum_draws": 30,\n        "ready": live_tested >= 30,\n        "twin_count": int(live_acc.get("twins", 0)) if live_acc else 0,\n        "ai_stats": {},\n        "bbfs_stats": {},\n        "paito_stats": {},\n        "trimmer_stats": {},\n        "sniper_stats": {},\n    }\n    if live_acc and live_tested > 0:\n        live_output = _build_output(live_acc, basis_draw_count, basis_last_draw, 0)\n        prospective.update({\n            "ai_stats": live_output["ai_stats"],\n            "bbfs_stats": live_output["bbfs_stats"],\n            "paito_stats": live_output["paito_stats"],\n            "trimmer_stats": live_output["trimmer_stats"],\n            "sniper_stats": live_output["sniper_stats"],\n        })\n\n    return {\n        "evaluator_version": EVALUATOR_VERSION,\n'''
          if anchor not in s:
              raise SystemExit('build output return anchor missing')
          s=s.replace(anchor,insert,1)

          s=s.replace(
              '        "sniper_stats": sniper_metric,\n        "accumulators": acc,\n',
              '        "sniper_stats": sniper_metric,\n        "prospective": prospective,\n        "accumulators": acc,\n',
              1,
          )
          p.write_text(s)
          PY
      - name: Commit evaluator change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production_evaluator.py
          git commit -m "feat(evaluation): separate prospective live metrics from replay" || true
          git push origin HEAD:feat/prospective-live-metrics
