name: Engine Correctness CI

on:
  push:
    branches:
      - main
      - fix/engine-correctness
      - feat/engine-parity-health
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q engine.py scraper.py production_evaluator.py production_health.py state_contract.py monitor_health.py scripts tests
      - run: ruff check --select E9,F63,F7,F82 .
      - run: python -m unittest discover -s tests -v
